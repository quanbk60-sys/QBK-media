<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>QBK Studio · Làm video mới</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Patrick+Hand&amp;display=swap">
<style>
body{margin:0}
a{color:#22306B}a:hover{color:#2A2723}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EADB; color: #2A2723; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 6px">
    <a href="Main.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2A2723"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span style="font-family: 'Patrick Hand', cursive; font-size: 30px; line-height: 1">Làm video mới</span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 4px 18px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="topic" style="font-size: 13px; font-weight: 700">Chủ đề</label>
      <textarea id="topic" rows="2" style="font-family: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 2px solid #2A2723; background: #FBF6EC; color: #2A2723; resize: none">Vì sao có thủy triều?</textarea>
      <span style="font-size: 12px; color: #6B6259">Một câu, một đường link, hoặc dán cả kịch bản đều được.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Thể loại</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #D8CBB5; background: #FBF6EC; color: #2A2723; font-family: inherit; font-size: 13px">Lịch sử</button>
        <button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #2A2723; background: #2A2723; color: #FBF6EC; font-family: inherit; font-size: 13px; font-weight: 600">Khoa học</button>
        <button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #D8CBB5; background: #FBF6EC; color: #2A2723; font-family: inherit; font-size: 13px">Ngụ ngôn</button>
        <button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #D8CBB5; background: #FBF6EC; color: #2A2723; font-family: inherit; font-size: 13px">Hoạt hình vui</button>
        <button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #D8CBB5; background: #FBF6EC; color: #2A2723; font-family: inherit; font-size: 13px">Tâm lý</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 700">Phong cách</span><span style="font-size: 12px; color: #6B6259">Đoàn phim gợi ý: Bảng phấn</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 1.5px solid #D8CBB5; background: #FBF6EC; font-family: inherit; color: #2A2723"><span style="height: 52px; border-radius: 8px; background: #F3EADB; border: 1px solid #2A2723"></span><span style="font-size: 11.5px">Giấy mực</span></button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 3px solid #D9442E; background: #FBF6EC; font-family: inherit; color: #2A2723"><span style="height: 52px; border-radius: 8px; background: #2F4A3A; border: 1px solid #2A2723"></span><span style="font-size: 11.5px; font-weight: 700">Bảng phấn ✓</span></button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 1.5px solid #D8CBB5; background: #FBF6EC; font-family: inherit; color: #2A2723"><span style="height: 52px; border-radius: 8px; background: #1F4E8C; border: 1px solid #2A2723"></span><span style="font-size: 11.5px">Bản vẽ kỹ thuật</span></button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 1.5px solid #D8CBB5; background: #FBF6EC; font-family: inherit; color: #2A2723"><span style="height: 52px; border-radius: 8px; background: #FFD23F; border: 1px solid #2A2723"></span><span style="font-size: 11.5px">Pop sặc sỡ</span></button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 1.5px solid #D8CBB5; background: #FBF6EC; font-family: inherit; color: #2A2723"><span style="height: 52px; border-radius: 8px; background: #E6DCC6; border: 1px solid #2A2723; border-top: 10px solid #0E0D0B; border-bottom: 10px solid #0E0D0B"></span><span style="font-size: 11.5px">Phác thảo</span></button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 1.5px dashed #D8CBB5; background: transparent; font-family: inherit; color: #6B6259"><span style="height: 52px; display: flex; align-items: center; justify-content: center; font-size: 20px">+4</span><span style="font-size: 11.5px">Xem thêm</span></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; background: #FBF6EC; border: 1.5px solid #D8CBB5; border-radius: 14px; padding: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center"><label for="len" style="font-size: 14px">Độ dài</label><span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">60 giây</span></div>
      <input id="len" type="range" min="45" max="75" value="60" style="width: 100%; accent-color: #D9442E">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px">Tốc độ giọng</span><span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: #F3EADB">1,2x · Bodi</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center"><label for="gate" style="font-size: 14px">Duyệt kịch bản trước</label><input id="gate" type="checkbox" style="width: 22px; height: 22px; accent-color: #D9442E"></div>
    </div>
  </div>

  <div style="padding: 12px 18px 22px; display: flex; flex-direction: column; gap: 8px; background: #F3EADB; border-top: 1.5px solid #D8CBB5">
    <span style="font-size: 12.5px; color: #6B6259; text-align: center">Ước tính: <b style="color: #2A2723">0đ</b> · khoảng 15–20 phút · gửi bạn khi xong</span>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #D9442E; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 4px 4px 0 #2A2723">Giao cho đoàn phim</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
