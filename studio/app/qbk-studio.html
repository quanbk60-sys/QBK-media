<title>QBK Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: a phone-first studio app; one column of screens, fixed 5-tab bar at the bottom, paper-and-ink look of the QBK videos */
:root{
  --paper:#F3EADB; --card:#FBF6EC; --ink:#2A2723; --muted:#6B6259; --line:#D8CBB5; --soft:#E5DACA;
  --red:#D9442E; --red-ink:#B5341F; --red-bg:#FCE3D9; --navy:#22306B; --navy-bg:#E4E8F6;
  --green:#5E8F3E; --green-ink:#3F6B2A; --green-bg:#E3EEDA; --gold:#C98F1E; --gold-bg:#FFF5DA; --on-accent:#FFFFFF;
  --display:"Patrick Hand","Comic Sans MS",cursive; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1D1A17; --card:#272320; --ink:#F1E8DA; --muted:#B4A898; --line:#4A423A; --soft:#3A342E;
  --red:#F06A52; --red-ink:#FF9C88; --red-bg:#4A2620; --navy:#9DB0F0; --navy-bg:#232A40;
  --green:#93C276; --green-ink:#B5DC9C; --green-bg:#25331F; --gold:#E9B654; --gold-bg:#3A2F17; --on-accent:#1D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1D1A17; --card:#272320; --ink:#F1E8DA; --muted:#B4A898; --line:#4A423A; --soft:#3A342E;
  --red:#F06A52; --red-ink:#FF9C88; --red-bg:#4A2620; --navy:#9DB0F0; --navy-bg:#232A40;
  --green:#93C276; --green-ink:#B5DC9C; --green-bg:#25331F; --gold:#E9B654; --gold-bg:#3A2F17; --on-accent:#1D1A17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
h1{font:400 34px/1 var(--display);margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--red)}
h2{font:700 12.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.card.hot{border:2px solid var(--red)}
.card.info{background:var(--navy-bg);border-color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile b.na{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:600 14.5px var(--body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-accent);box-shadow:3px 3px 0 var(--ink)}
.btn.ok{background:var(--green);border-color:var(--green);color:var(--on-accent);box-shadow:3px 3px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-width:1.5px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tab:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-wait{background:var(--red-bg);color:var(--red-ink)} .p-work{background:var(--gold-bg);color:var(--gold)} .p-ok{background:var(--green-bg);color:var(--green-ink)} .p-mute{background:var(--soft);color:var(--muted)} .p-navy{background:var(--navy-bg);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.thumb{width:74px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1.5px solid var(--ink);flex-shrink:0;background:var(--soft)}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)} .steps i.done{background:var(--green)} .steps i.now{background:var(--gold)}
.steplab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;font-size:10px;color:var(--muted)}
.steplab .now{color:var(--ink);font-weight:600}
label.f{font-size:13px;font-weight:700}
input[type=text],input[type=url],textarea,select{width:100%;font:16px var(--body);padding:11px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
textarea{resize:vertical}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sty{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:11.5px var(--body);cursor:pointer;text-align:left}
.sty i{height:46px;border-radius:8px;border:1px solid var(--ink);display:block}
.sty img.prev{width:100%;aspect-ratio:9/12;object-fit:cover;object-position:center 40%;border-radius:8px;border:1px solid var(--ink);display:block}
.sty[aria-pressed="true"]{border:3px solid var(--red);font-weight:700}
.vidbox{display:flex;gap:12px;align-items:flex-start}
video{width:160px;aspect-ratio:9/16;border-radius:14px;border:2px solid var(--ink);background:#000;flex-shrink:0}
.fb{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.ts{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--ink);color:var(--paper);font-variant-numeric:tabular-nums}
.list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--soft);min-height:48px}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex-shrink:0} .dot.on{background:var(--gold)} .dot.done{background:var(--green)}
.model{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;border:1.5px solid currentColor}
.m-opus{color:var(--red-ink)} .m-sonnet{color:var(--navy)} .m-haiku{color:var(--green-ink)}
.lesson{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--card);border-left:4px solid var(--green)}
.copybox{white-space:pre-wrap;font-size:14px;line-height:1.5}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:13.5px;text-align:center}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.score span{padding:4px 0;border-radius:6px;background:var(--paper)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;border-bottom:1.5px solid var(--ink);padding:0 4px}
.bars span{flex:1;border-radius:6px 6px 0 0;background:var(--red);min-height:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;min-height:48px;justify-content:center;border-radius:10px;position:relative}
.tab[aria-current="page"]{color:var(--red);font-weight:700}
.tab .badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:var(--on-accent);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet .box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:var(--red-ink)}
.dl summary{cursor:pointer;font-weight:600;font-size:13.5px;min-height:36px;line-height:36px}
.dlrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.del{background:none;border:0;color:var(--muted);font:600 12.5px var(--body);text-decoration:underline;cursor:pointer;padding:6px 0;min-height:32px;align-self:flex-start}
.voices{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding-right:2px}
.vo{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;min-height:52px}
.vo[aria-checked="true"]{border:2.5px solid var(--red)}
.vo .grow{flex:1;min-width:0;text-align:left}
.play{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.play[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.att{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.att .pv{width:56px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;border:1px solid var(--ink);background:var(--soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.att .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.att .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.att input[type=text]{padding:8px 10px;font-size:14px;border-width:1.5px}
.chips.sm .chip{min-height:32px;font-size:12px;padding:0 10px}
.xbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;flex-shrink:0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border:2px dashed var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:center;font-size:14px;font-weight:600;color:var(--ink)}
.drop:focus-within{outline:3px solid var(--navy);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
details.card>summary{cursor:pointer;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ask{border:2px solid var(--gold);background:var(--gold-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(92vw,480px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.back{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);border-radius:10px;text-decoration:none}
.small{font-size:12px;color:var(--muted)}
a.link{color:var(--navy)}
/* Xưởng AI: 3 khâu Họa Sĩ (ChatGPT) → Quay Phim (Gemini) → Dựng Phim (Claude) */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.flow button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:12px var(--body);cursor:pointer;text-align:left;min-height:56px}
.flow button b{font-size:14px}
.flow button[aria-current="step"]{border:2.5px solid var(--red)}
.flow button.done b::after{content:" ✓";color:var(--green-ink)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gi{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.gi img,.gi video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);background:var(--soft)}
.gi.on img{border:3px solid var(--green)}
.gi .tools{display:flex;gap:4px;flex-wrap:wrap}
.gi .tools .btn{min-height:32px;padding:0 8px;font-size:12px;flex:1}
.who{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--soft);color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Điều hướng chính"><div class="in" id="tabs"></div></nav>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
</div>

<script>
(() => {
  const BASE_STYLES = [
    ["anime-dong","Anime · hoạt hình động","linear-gradient(#3a86d6,#3f9a45)",null,"omni"],["anime-tinh","Anime · ảnh tĩnh","linear-gradient(#1b2a4a,#e9a95b)",null,"2d"],
    ["ve-tinh","Vệ tinh · địa lý","linear-gradient(135deg,#1d3b2a,#0b1118 55%,#FF8A1F)",null,"ve-tinh"],["thi-nghiem","Thí nghiệm 3D · khoa học","#d9d5ce",null,"3d"]];
  // Phong cách đoàn phim học thêm được ghi vào db (app/styles.list) và tự hiện ở đây, không cần đăng lại app.
  // app/styles.full = true: the db list is the whole catalogue (order, name, preview image, note); otherwise built-ins + learned ones
  const dbStyles = () => ((S.stylesDoc?.list) || []).filter(x => x?.id);
  const styles = () => S.stylesDoc?.full ? dbStyles().map(x => [x.id, x.name || x.id, x.color || "#8A8A8A", x.thumb, x.engine])
    : [...BASE_STYLES, ...dbStyles().filter(x => !BASE_STYLES.some(b => b[0] === x.id)).map(x => [x.id, x.name || x.id, x.color || "#8A8A8A", x.thumb, x.engine])];
  const styleNote = id => dbStyles().find(x => x.id === id)?.note || STYLE_NOTE[id] || "";
  const STYLE_NOTE = {"ve-tinh":"Nền ảnh vệ tinh thật, zoom từ quả địa cầu, ảnh thật từ Wikimedia (ghi tác giả), chữ trắng cam. Không người que. Hợp địa lý, trận đánh có địa điểm thật, công trình."};
  const STEPS = ["Kịch bản","Dự toán","Mỹ thuật","Quay","Dựng","Kiểm định"];
  const STATUS = {
    "dang-lam": ["Đang làm","p-work"], "cho-duyet": ["Chờ duyệt","p-wait"], "dang-sua": ["Đang sửa","p-work"],
    "da-duyet": ["Đã duyệt · chờ đăng","p-ok"], "da-dang": ["Đã đăng","p-navy"], "tam-dung": ["Tạm dừng","p-mute"]};
  const TRIGGER = "trig_01S2GWJmEdKSxZesBjXC3gFB"; // tác vụ "Đoàn phim QBK: nhận việc từ app"
  async function fireCrew(why) {
    if (!S.mcp) return false;
    try { await S.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: TRIGGER, text: why }); return true; }
    catch (e) { console.warn("fire_trigger", e?.code); return false; }
  }
  const S = { mcp: null, videos: [], requests: [], stylesDoc: null, styleReqs: [], learnUrl: "", feedback: [], trends: null, crew: null, stats: null, db: null, dl: null, assets: null, ready: false,
    sel: null, draftFb: [], form: null, voicesDoc: null, playing: null, answers: {}, pipes: [], pipeSel: null, pend: {} };
  // Phiếu yêu cầu (thay ô "Chủ đề" một dòng): lời dặn tự do + tệp đính kèm + bắt buộc có / không được có / nguồn + cho phép hỏi lại
  const newForm = () => ({ brief: "", must: "", avoid: "", links: "", files: [], clarify: true, style: "anime-dong", length: 45, gate: true, gateA: true, narration: true, voice: "", platform: "tiktok" });
  const DRAFT_KEY = "qbk-draft-v2";
  const loadDraft = () => { try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (d) return { ...newForm(), ...d, files: (d.files || []).filter(x => x.id) }; } catch {} return newForm(); };
  const saveDraft = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ ...S.form, files: S.form.files.filter(x => x.id).map(({ url, ...x }) => x) })); } catch {} };
  const ROLES = [["dung", "Đưa vào video"], ["mau", "Mẫu phong cách"], ["tu-lieu", "Tư liệu nội dung"]];
  const kindOf = t => t.startsWith("image/") ? "image" : t.startsWith("video/") ? "video" : "doc";
  const HINTS = ["Mở đầu gây tò mò", "Kết bằng một bài học", "Giọng hài hước", "Có số liệu cụ thể", "Có nhân vật đối thoại", "Kết bằng câu hỏi cho người xem"];
  const MAX_MB = 20;
  // Nền tảng quyết định khung hình: dọc 9:16 (TikTok, Facebook Reels, YouTube Shorts) hoặc ngang 16:9 (YouTube)
  const PLATFORMS = [["tiktok", "TikTok", "9:16"], ["facebook", "Facebook Reels", "9:16"], ["shorts", "YouTube Shorts", "9:16"], ["youtube", "YouTube", "16:9"]];
  const platOf = id => PLATFORMS.find(p => p[0] === id) || PLATFORMS[0];
  const maxLen = f => platOf(f.platform)[2] === "16:9" ? 300 : 90;
  S.form = loadDraft();
  const isAnime = id => /^anime/.test(id || "");
  const fmtLen = n => n >= 60 ? Math.floor(n / 60) + " phút" + (n % 60 ? " " + (n % 60) + " giây" : "") : n + " giây";

  const $ = (s, r = document) => r.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const blob = id => id ? "/_blob/" + encodeURIComponent(id) : "";
  const mmss = t => { t = Math.max(0, Math.round(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
  const styleName = id => (styles().find(s => s[0] === id) || [id, id])[1];
  const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); };
  const nowISO = () => new Date().toISOString();
  const daysLeft = d => { if (!d) return null; const ms = new Date(d + "T00:00:00+07:00") - Date.now(); return Math.ceil(ms / 864e5); };

  const ICON = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8M14 7h7v7"/>',
    new: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>',
    report: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
    crew: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2.2 1.3-4 3.5-4S21 17.8 21 20"/>',
    xuong: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
    back: '<path d="M15 5l-7 7 7 7"/>'
  };
  const svg = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
  const TABS = [["home","Trang chủ"],["new","Làm video"],["xuong","Xưởng AI"],["report","Báo cáo"],["crew","Đoàn phim"]];

  function route() { const h = (location.hash || "#home").slice(1); return ["home","new","xuong","learn","review","post","report","crew"].includes(h) ? h : "home"; }
  function go(h) { if (location.hash !== "#" + h) location.hash = h; else render(); }
  window.addEventListener("hashchange", render);

  function renderTabs(cur) {
    const waiting = S.videos.filter(v => v.status === "cho-duyet").length;
    const map = { review: "home", post: "home", learn: "new" };
    const active = map[cur] || cur;
    $("#tabs").innerHTML = TABS.map(([k, l]) => `<a class="tab" href="#${k}" ${active === k ? 'aria-current="page"' : ""}>${svg(k)}${l}${k === "home" && waiting ? `<span class="badge">${waiting}</span>` : ""}</a>`).join("");
  }

  // Dự toán do agent du-toan ghi vào videos/<id>.estimate = {usd, cap, items:[{what, usd}], note, needApproval, approved, spent}
  const usd = n => (typeof n === "number" ? (n < 0.005 ? "0 USD" : n.toFixed(2).replace(".", ",") + " USD") : "?");
  const needCost = v => !!(v.estimate && v.estimate.needApproval && !v.estimate.approved);
  const costLine = v => { const e = v.estimate; if (!e) return "";
    const parts = [`Dự toán ${usd(e.usd)}`]; if (typeof e.cap === "number") parts.push(`trần ${usd(e.cap)}`); if (typeof e.spent === "number") parts.push(`đã chi ${usd(e.spent)}`);
    return `<span class="small" style="color:${needCost(v) ? "var(--red-ink)" : "var(--green-ink)"}">${esc(parts.join(" · "))}${needCost(v) ? " · vượt trần, chờ bạn duyệt" : ""}</span>`; };
  // Duyệt kịch bản (khi bạn tích "Cho mình duyệt kịch bản trước"): đoàn phim ghi videos/<id>.script và scriptStatus = "cho-duyet"
  const scriptWaiting = v => (v.status === "dang-lam" || v.status === "dang-sua") && (v.scriptStatus === "cho-duyet" || (!v.scriptStatus && v.stage === "Kịch bản" && /duyệt kịch bản/i.test(v.stageNote || "")));
  const scriptText = v => v.script || (v.report || [])[0] || "";
  const scriptBox = v => `<details class="card col" open style="padding:10px;gap:8px;border-color:var(--red)"><summary style="cursor:pointer;font-weight:700;min-height:32px">Kịch bản chờ bạn duyệt</summary>
      <div class="copybox" style="font-size:14px;max-height:320px;overflow:auto">${esc(scriptText(v)) || "Đoàn phim chưa gửi nội dung kịch bản."}</div>
      ${v.scriptCheck ? `<span class="small" style="color:var(--green-ink)"><b>Đối chiếu yêu cầu:</b> ${esc(v.scriptCheck)}</span>` : ""}
      <label for="sfb-${esc(v.id)}" class="small">Muốn sửa gì thì ghi ở đây (không bắt buộc)</label>
      <textarea id="sfb-${esc(v.id)}" rows="2" placeholder="Ví dụ: thêm cảnh mẹ đón ở cửa, bớt câu cuối"></textarea>
      <div class="tiles two" style="margin-top:2px"><button class="btn" data-scriptfb="${esc(v.id)}">Gửi góp ý</button><button class="btn ok" data-scriptok="${esc(v.id)}">Duyệt kịch bản</button></div></details>`;
  // Cổng 3: animatic (bản dựng thô bằng khung hình) trước khi quay bằng Omni
  const animWaiting = v => v.animaticStatus === "cho-duyet" && !!v.animatic && v.status !== "da-duyet" && v.status !== "da-dang";
  const animBox = v => `<details class="card col" open style="padding:10px;gap:8px;border-color:var(--red)"><summary style="cursor:pointer;font-weight:700;min-height:32px">Bản dựng thô chờ bạn duyệt</summary>
      <span class="small">Xem nhịp phim và hình từng cảnh trước khi đoàn phim quay (bước tốn tiền). ${v.estimate ? "Chi phí quay theo dự toán: " + esc(usd(v.estimate.usd)) + "." : ""}</span>
      ${v.animatic ? `<video src="${blob(v.animatic)}" controls playsinline preload="metadata" style="width:100%;max-width:240px;align-self:center"></video>` : `<span class="small">Chưa có file.</span>`}
      <label for="afb-${esc(v.id)}" class="small">Cảnh nào cần sửa thì ghi ở đây (ví dụ: cảnh 3 cho bé quay mặt lại)</label>
      <textarea id="afb-${esc(v.id)}" rows="2"></textarea>
      <div class="tiles two"><button class="btn" data-animfb="${esc(v.id)}">Gửi góp ý</button><button class="btn ok" data-animok="${esc(v.id)}">Duyệt, bắt đầu quay</button></div></details>`;
  // Dự toán thời gian: số phút của từng bước STEPS theo phong cách, ước lượng từ các video đã làm (mốc 45 giây).
  // Đoàn phim có thể ghi đè bảng bằng app/stats.etaMinutes[style]; ghi videos/<id>.stageStartedAt (lúc bắt đầu bước hiện tại) và .eta (giờ dự kiến xong, ISO) thì app dùng số đó.
  const ETA_MIN = { "anime-dong": [10, 5, 25, 35, 10, 5], "anime-tinh": [10, 3, 20, 0, 10, 5], "ve-tinh": [8, 2, 10, 12, 8, 5], "thi-nghiem": [8, 2, 12, 15, 8, 5], _: [8, 2, 12, 12, 8, 5] };
  const ETA_SCALE = [0, 0, 1, 1, 0.5, 0]; // bước nào dài ra theo độ dài phim
  const etaTable = (style, len) => { const base = S.stats?.etaMinutes?.[style] || ETA_MIN[style] || ETA_MIN._, k = (+len || 45) / 45;
    return STEPS.map((_, i) => Math.round((base[i] || 0) * (1 + (k - 1) * ETA_SCALE[i]))); };
  const etaTotal = (style, len) => etaTable(style, len).reduce((a, b) => a + b, 0);
  const minsSince = iso => { const t = Date.parse(iso || ""); return isNaN(t) ? null : (Date.now() - t) / 6e4; };
  const hhmm = d => d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  const dur = m => { m = Math.max(1, Math.round(m)); return m < 60 ? m + " phút" : Math.floor(m / 60) + " giờ" + (m % 60 ? " " + (m % 60) + " phút" : ""); };
  const waitingUser = v => scriptWaiting(v) || animWaiting(v) || needCost(v);
  function etaInfo(v) {
    if (!(v.status === "dang-lam" || v.status === "dang-sua")) return null;
    if (waitingUser(v)) return { wait: true };
    const tbl = etaTable(v.style, v.duration || v.length);
    let idx = STEPS.indexOf(v.stage); if (idx < 0) idx = v.status === "dang-sua" ? 2 : 0;
    const cur = tbl[idx] || 3, since = minsSince(v.stageStartedAt || v.updatedAt) ?? 0;
    let left = Math.max(2, cur - since) + tbl.slice(idx + 1).reduce((a, b) => a + b, 0);
    if (v.status === "dang-sua") left *= 0.6; // sửa theo góp ý: chỉ làm lại cảnh bị góp ý
    const crewEta = Date.parse(v.eta || ""), fromCrew = !isNaN(crewEta);
    if (fromCrew) left = (crewEta - Date.now()) / 6e4;
    const quiet = minsSince(v.updatedAt) ?? 0, revived = minsSince(v.reviveAt);
    const stale = (quiet > 30 && quiet > cur + 20) || (fromCrew && left < -20);
    return { left, end: new Date(Date.now() + Math.max(0, left) * 6e4), quiet, stale, fromCrew, revivedRecently: revived != null && revived < 15 && revived < quiet };
  }
  // Trạng thái lượt chạy thật của đoàn phim: hỏi tác vụ (get_trigger → phiên mới nhất) rồi hỏi phiên đó (get_session) mỗi 30 giây.
  // Không hỏi được (thiết bị không cho, chưa cho phép) thì dùng app/run do Nhà sản xuất ghi: {state: running|idle|error, startedAt, endedAt, heartbeat, step, video, note}.
  const tms = iso => { const t = Date.parse(iso || ""); return isNaN(t) ? null : t; };
  const ago = t => { const m = (Date.now() - t) / 6e4; return m < 1 ? "vừa xong" : dur(m) + " trước"; };
  function runState() {
    const s = S.run;
    if (s && s.session) {
      const st = String(s.session.session_status || s.session.status || ""), b = String(s.session.status_bucket || "");
      const running = /RUNNING|WORKING|STARTING|PENDING/i.test(st) || /WORKING/i.test(b);
      return { known: true, running, failed: /FAIL/i.test(b), since: tms(s.firedAt) || tms(s.session.created_at), end: running ? null : tms(s.session.updated_at), src: "live" };
    }
    const d = S.runDoc; if (!d) return { known: false };
    const beat = tms(d.heartbeat) || tms(d.startedAt);
    const running = d.state === "running" && beat != null && Date.now() - beat < 45 * 6e4;
    return { known: true, running, failed: d.state === "error", since: tms(d.startedAt), end: running ? null : (tms(d.endedAt) || beat), src: "doc" };
  }
  function runHtml() {
    const r = runState(), d = S.runDoc || {};
    if (!r.known) return S.runErr ? `<span class="small">Chưa xem được đoàn phim còn chạy hay không (${esc(S.runErr)}). Dòng "Dự kiến xong" bên dưới vẫn là ước tính.</span>` : `<span class="small">Đang hỏi trạng thái đoàn phim…</span>`;
    const note = d.note || d.summary || "";
    if (r.running) return `<div class="row" style="gap:8px"><span class="dot on" aria-hidden="true"></span><b style="font-size:14px">Đoàn phim đang chạy</b></div>
      <span class="small">Bắt đầu ${r.since ? hhmm(new Date(r.since)) + " (" + ago(r.since) + ")" : ""}${d.step ? " · đang ở: " + esc(d.step) : ""}${d.video ? " · " + esc(d.video) : ""}</span>${note && d.state === "running" ? `<span class="small">${esc(note)}</span>` : ""}`;
    return `<div class="row" style="gap:8px"><span class="dot ${r.failed ? "" : "done"}" style="${r.failed ? "background:var(--red)" : ""}" aria-hidden="true"></span><b style="font-size:14px">${r.failed ? "Lượt chạy cuối bị lỗi" : "Đoàn phim đang nghỉ"}</b></div>
      <span class="small">Lượt cuối kết thúc ${r.end ? hhmm(new Date(r.end)) + " (" + ago(r.end) + ")" : "?"}. Không có ai đang làm cho tới khi bạn giao việc, duyệt hoặc bấm "Gọi đoàn phim làm tiếp".</span>${note ? `<span class="small">Báo cáo lượt cuối: ${esc(note)}</span>` : ""}`;
  }
  // Video còn ghi "đang làm" nhưng đoàn phim đã nghỉ sau lần cập nhật cuối của video: chắc chắn đã dừng.
  const crewStopped = v => { const r = runState(); if (!r.known || r.running || waitingUser(v)) return false; const u = tms(v.updatedAt) || 0; return !r.end || r.end >= u - 6e4; };
  const lastLog = v => (Array.isArray(v.log) && v.log.length ? v.log[v.log.length - 1] : null);
  const reviveBtn = (v, label) => S.db ? `<button class="btn sm" data-revive="${esc(v.id)}" style="align-self:flex-start">${label || "Gọi đoàn phim làm tiếp"}</button>` : "";
  function etaHtml(v) {
    const e = etaInfo(v); if (!e) return "";
    const err = v.error && (v.error.msg || v.error.message);
    if (err) return `<span class="small" style="color:var(--red-ink)"><b>Dừng ở bước ${esc(v.error.step || v.stage || "?")}${tms(v.error.at) ? " lúc " + hhmm(new Date(tms(v.error.at))) : ""}:</b> ${esc(err)}</span>${reviveBtn(v, "Làm lại bước này")}`;
    if (e.wait) return `<span class="small">Đang chờ bạn duyệt. Đồng hồ chạy lại khi bạn bấm duyệt.</span>`;
    const upd = `cập nhật ${e.quiet < 1 ? "vừa xong" : dur(e.quiet) + " trước"}`;
    if (e.revivedRecently) return `<span class="small" style="color:var(--gold)">Đã gọi lại đoàn phim lúc ${hhmm(new Date(Date.parse(v.reviveAt)))}, chờ họ nhận việc (1–3 phút).</span>`;
    const ll = lastLog(v);
    if (crewStopped(v)) { const r = runState();
      return `<span class="small" style="color:var(--red-ink)"><b>Đã dừng ở bước ${esc(v.stage || "?")}</b>: đoàn phim nghỉ lúc ${r.end ? hhmm(new Date(r.end)) : "?"} mà chưa báo xong hay báo lỗi.${ll ? " Việc cuối: " + esc(ll.msg) + "." : ""}</span>${reviveBtn(v)}`; }
    if (e.stale && !runState().running) return `<span class="small" style="color:var(--red-ink)"><b>Có thể đã dừng:</b> không thấy đoàn phim cập nhật ${dur(e.quiet)} (từ ${hhmm(new Date(Date.parse(v.updatedAt)))}).</span>${reviveBtn(v)}`;
    const live = runState().running ? ` · <b style="color:var(--green-ink)">đoàn phim đang chạy</b>` : "";
    const now = ll ? `<span class="small">Đang làm: ${esc(ll.step ? ll.step + " · " : "")}${esc(ll.msg)}${tms(ll.at) ? " (" + ago(tms(ll.at)) + ")" : ""}</span>` : "";
    if (e.left <= 0) return `${now}<span class="small">Sắp xong, đang hoàn tất · ${upd}${live}</span>`;
    return `${now}<span class="small">Dự kiến xong khoảng <b style="color:var(--ink)">${hhmm(e.end)}</b> · còn ~${dur(e.left)}${e.fromCrew ? "" : " (ước tính)"} · ${upd}${live}</span>`;
  }
  // Nhật ký từng bước: videos/<id>.log = [{at, step, msg, level: info|warn|error}] (đoàn phim thêm một dòng ở mỗi bước, giữ 30 dòng gần nhất)
  const LOGC = { error: "var(--red-ink)", warn: "var(--gold)" };
  const logHtml = v => !Array.isArray(v.log) || !v.log.length ? "" : `<details class="dl" style="margin-top:6px"><summary>Nhật ký (${v.log.length})</summary><div class="col" style="gap:4px;margin-top:4px">${v.log.slice(-30).reverse().map(l => `<span class="small" style="${LOGC[l.level] ? "color:" + LOGC[l.level] : ""}"><b class="ts" style="font-size:10.5px;padding:1px 5px">${tms(l.at) ? hhmm(new Date(tms(l.at))) : "--:--"}</b> ${esc(l.step ? l.step + ": " : "")}${esc(l.msg)}</span>`).join("")}</div></details>`;
  // Tải về máy: videos/<id>.downloads = [{label, res, mb, asset}] (đoàn phim tạo bằng studio/tools/renditions.py); chưa có thì tải bản đang xem trên app
  const DONE = ["cho-duyet", "da-duyet", "da-dang"];
  const dlList = v => !DONE.includes(v.status) ? [] : (v.downloads?.length ? v.downloads : v.video ? [{ label: "Bản trên app", res: "", asset: v.video }] : []);
  async function saveVideo(v, d, btn) {
    if (!S.dl) { toast("Thiết bị này không cho tải file từ app."); return; }
    const old = btn.innerHTML; btn.disabled = true; btn.textContent = "Đang chuẩn bị…";
    try { const res = await fetch(blob(d.asset)); const data = await res.blob();
      await S.dl.save({ filename: `${v.id}-${(d.res || "app").replace(/\W/g, "")}.mp4`, data }); toast("Đã lưu video " + (d.res || ""));
    } catch (e) { toast(e?.code === "declined" ? "Đã hủy tải" : "Chưa tải được file"); }
    btn.disabled = false; btn.innerHTML = old;
  }
  function videoCard(v, big) {
    const st = STATUS[v.status] || ["", "p-mute"];
    const stepIdx = Math.max(0, STEPS.indexOf(v.stage));
    const working = v.status === "dang-lam" || v.status === "dang-sua";
    return `<div class="card ${v.status === "cho-duyet" ? "hot" : ""}">
      <div class="row" style="align-items:flex-start">
        ${v.thumb ? `<img class="thumb" src="${blob(v.thumb)}" alt="Ảnh bìa ${esc(v.title)}">` : `<span class="thumb" aria-hidden="true"></span>`}
        <div class="col" style="flex:1">
          <span><span class="pill ${st[1]}">${st[0]}${v.round ? " · vòng " + esc(v.round) : ""}</span></span>
          <span style="font:400 23px/1.05 var(--display)">${esc(v.title)}</span>
          <span class="small">${v.platform ? esc(platOf(v.platform)[1]) + " · " : ""}${esc(styleName(v.style))}${v.duration ? " · " + esc(v.duration) + " giây" : ""}</span>
          ${working ? `<span class="small">${esc(v.stageNote || "")}</span><span class="col" style="gap:6px" data-eta="${esc(v.id)}">${etaHtml(v)}</span>` : ""}
          ${costLine(v)}
          ${needCost(v) ? `<button class="btn ok sm" data-approvecost="${esc(v.id)}">Duyệt chi phí ${esc(usd(v.estimate.usd))}</button>` : ""}
          ${v.status === "cho-duyet" && v.video ? `<a class="btn dark sm" href="#review" data-sel="${esc(v.id)}">Xem và duyệt</a>` : ""}
          ${v.video && v.status !== "cho-duyet" ? `<button class="btn dark sm" data-watch="${esc(v.id)}">▶ Xem video${v.round > 1 ? " · vòng " + esc(v.round) : ""}</button>` : ""}
          ${v.status === "da-duyet" ? `<a class="btn sm" href="#post" data-sel="${esc(v.id)}">Mở bộ đăng bài</a>` : ""}
          ${S.db ? `<button class="del" data-del="${esc(v.id)}">Xóa video</button>` : ""}
        </div>
      </div>
      ${scriptWaiting(v) ? `<div style="margin-top:10px">${scriptBox(v)}</div>` : ""}
      ${animWaiting(v) ? `<div style="margin-top:10px">${animBox(v)}</div>` : ""}
      ${dlList(v).length ? `<details class="dl" style="margin-top:10px"><summary>Tải về máy</summary><div class="dlrow">${dlList(v).map((d, i) => `<button class="btn sm" data-dlv="${esc(v.id)}" data-dli="${i}"><b>${esc(d.label)}</b>&nbsp;<span class="small">${esc(d.res || "")}${d.mb ? " · " + esc(String(d.mb).replace(".", ",")) + " MB" : ""}</span></button>`).join("")}</div></details>` : ""}
      ${logHtml(v)}
      ${working ? `<div class="col" style="margin-top:10px;gap:4px"><div class="steps">${STEPS.map((_, i) => `<i class="${i < stepIdx ? "done" : i === stepIdx ? "now" : ""}"></i>`).join("")}</div>
      <div class="steplab">${STEPS.map((s, i) => `<span class="${i === stepIdx ? "now" : ""}">${s}</span>`).join("")}</div></div>` : ""}
    </div>`;
  }

  const V = {};
  V.home = () => {
    const waiting = S.videos.filter(v => v.status === "cho-duyet");
    const working = S.videos.filter(v => v.status === "dang-lam" || v.status === "dang-sua");
    const ready = S.videos.filter(v => v.status === "da-duyet");
    const pending = S.requests.filter(r => r.status === "moi" || r.status === "tra-loi");
    const asks = S.requests.filter(r => r.status === "can-hoi");
    const made = S.videos.length, posted = S.videos.filter(v => v.status === "da-dang").length;
    return `<div class="row between"><div><h1>QBK <em>Studio</em></h1><p class="sub">Xưởng phim ngắn: anime, vệ tinh, thí nghiệm 3D</p></div></div>
      <a class="btn primary big" href="#new">Làm video mới</a>
      <div class="tiles"><div class="tile"><b>${made}</b><span>video đã làm</span></div><div class="tile"><b>${posted}</b><span>đã đăng</span></div><div class="tile"><b>${esc(S.stats?.costMonth ?? "0đ")}</b><span>chi phí tháng</span></div></div>
      ${!S.ready ? `<div class="empty">Đang tải dữ liệu của xưởng…</div>` : ""}
      <div class="card col" style="gap:4px" data-run>${runHtml()}</div>
      ${asks.length ? `<h2>Đoàn phim cần bạn trả lời</h2>${asks.map(askCard).join("")}` : ""}
      ${waiting.length ? `<h2>Cần bạn duyệt</h2>${waiting.map(v => videoCard(v)).join("")}` : ""}
      ${pending.length ? `<h2>Yêu cầu đã gửi</h2><div class="list">${pending.map(r => `<div class="li"><div class="grow"><b style="font-weight:600">${esc(r.topic)}</b><div class="small">${r.genre ? esc(r.genre) + " · " : ""}${esc(styleName(r.style))}${r.attachments?.length ? ` · ${r.attachments.length} tệp` : ""} · ${r.status === "tra-loi" ? "đã trả lời, chờ đoàn phim làm tiếp" : "chờ đoàn phim nhận"} · làm khoảng ${dur(etaTotal(r.style, r.length))}</div></div><span class="pill p-mute">${r.status === "tra-loi" ? "Đã trả lời" : "Mới"}</span></div>`).join("")}</div>
        <p class="small">Đoàn phim được gọi ngay khi bạn gửi. Nếu yêu cầu nằm ở đây quá 10 phút, nhắn "chạy đi" cho Claude.</p>` : ""}
      ${working.length ? `<h2>Đang làm</h2>${working.map(v => videoCard(v)).join("")}` : ""}
      ${ready.length ? `<h2>Chờ đăng</h2>${ready.map(v => videoCard(v)).join("")}` : ""}
      ${S.videos.some(v => v.status === "da-dang" || v.status === "tam-dung") ? `<details class="card"><summary style="cursor:pointer;font-weight:600;min-height:32px">Đã đăng và tạm dừng (${S.videos.filter(v => v.status === "da-dang" || v.status === "tam-dung").length})</summary><div class="col" style="margin-top:10px">${S.videos.filter(v => v.status === "da-dang" || v.status === "tam-dung").map(v => videoCard(v)).join("")}</div></details>` : ""}
      ${S.ready && !waiting.length && !working.length && !ready.length && !pending.length ? `<div class="empty">Chưa có video nào đang làm. Bấm "Làm video mới".</div>` : ""}
`;
  };

  // Câu hỏi làm rõ: đoàn phim ghi requests/<id> {status: "can-hoi", understanding, questions: [{q, options?}]}
  function askCard(r) {
    const a = S.answers[r.id] || (S.answers[r.id] = {}), qs = r.questions || [];
    return `<form class="card ask col" style="gap:12px" data-askf="${esc(r.id)}"><div class="row between"><b>${esc(r.topic)}</b><span class="pill p-wait">Cần trả lời</span></div>
      ${r.understanding ? `<div class="col" style="gap:2px"><span class="small" style="font-weight:700">Đoàn phim hiểu yêu cầu là:</span><span style="font-size:13.5px">${esc(r.understanding)}</span></div>` : ""}
      ${qs.map((q, i) => `<div class="col" style="gap:6px"><span style="font-size:14px;font-weight:600">${i + 1}. ${esc(q.q)}</span>
        ${q.options?.length ? `<div class="chips sm">${q.options.map(o => `<button type="button" class="chip" data-ansopt="${esc(r.id)}|${i}" data-val="${esc(o)}" aria-pressed="${a[i] === o}">${esc(o)}</button>`).join("")}</div>` : ""}
        <input type="text" data-ans="${esc(r.id)}|${i}" value="${esc(a[i] || "")}" placeholder="${q.options?.length ? "Hoặc gõ câu trả lời khác" : "Câu trả lời của bạn"}" aria-label="Trả lời câu ${i + 1}"></div>`).join("")}
      <div class="col" style="gap:6px"><span style="font-size:14px;font-weight:600">Dặn thêm (không bắt buộc)</span><input type="text" data-ans="${esc(r.id)}|extra" value="${esc(a.extra || "")}" placeholder="Ví dụ: câu 2 các bạn tự chọn" aria-label="Dặn thêm"></div>
      <button class="btn primary" type="submit">Gửi trả lời</button></form>`;
  }
  function fileList() {
    return S.form.files.map((x, i) => `<div class="att">
      ${x.kind === "image" && (x.url || x.id) ? `<img class="pv" src="${esc(x.url || blob(x.id))}" alt="">` : x.kind === "video" && (x.url || x.id) ? `<video class="pv" src="${esc(x.url || blob(x.id))}#t=0.5" muted playsinline preload="metadata"></video>` : `<span class="pv">${x.kind === "doc" ? "TÀI LIỆU" : "…"}</span>`}
      <div class="grow"><div class="row between" style="gap:6px"><span class="nm">${esc(x.name)}</span>
        <span class="pill ${x.status === "ok" ? "p-ok" : x.status === "err" ? "p-wait" : "p-work"}">${x.status === "ok" ? (x.size < 1048576 ? Math.max(1, Math.round(x.size / 1024)) + "KB" : (x.size / 1048576).toFixed(1).replace(".", ",") + "MB") : x.status === "err" ? "Lỗi" : "Đang tải…"}</span></div>
        <div class="chips sm" aria-label="Dùng tệp này để">${ROLES.map(([k, l]) => `<button type="button" class="chip" data-role="${i}|${k}" aria-pressed="${x.role === k}">${l}</button>`).join("")}</div>
        <input type="text" data-fnote="${i}" value="${esc(x.note || "")}" aria-label="Ghi chú cho tệp ${esc(x.name)}" placeholder="${x.role === "dung" ? "Ví dụ: nhân vật chính, đặt ở cảnh mở đầu" : x.role === "mau" ? "Ví dụ: học nhịp cắt và kiểu chữ" : "Ví dụ: số liệu ở trang 3"}"></div>
      <button type="button" class="xbtn" data-frm="${i}" aria-label="Bỏ tệp ${esc(x.name)}">×</button></div>`).join("");
  }
  function refreshFiles() { const el = $("#flist"); if (el) { el.innerHTML = fileList(); bindFiles(); } saveDraft(); }
  async function addFiles(list) {
    for (const file of list) {
      if (file.size > MAX_MB * 1048576) { toast(`"${file.name}" lớn hơn ${MAX_MB}MB. Cắt ngắn video hoặc dán link vào ô yêu cầu.`); continue; }
      const kind = kindOf(file.type || "");
      const x = { name: file.name, type: file.type, size: file.size, kind, role: kind === "video" ? "mau" : kind === "image" ? "dung" : "tu-lieu", note: "", status: "up" };
      S.form.files.push(x); refreshFiles();
      try { const res = await S.assets.upload(file); Object.assign(x, { id: res.id, url: res.url, status: "ok" }); }
      catch (e) { x.status = "err"; toast(`Chưa tải được "${file.name}": ` + (e?.code === "unsupported_type" ? "loại tệp không hỗ trợ." : e?.code === "quota_exceeded" ? "kho tệp của app đã đầy." : "thử lại sau.")); }
      refreshFiles();
    }
  }
  function bindFiles() {
    const f = S.form;
    document.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { const [i, k] = b.dataset.role.split("|"); if (f.files[+i]) { f.files[+i].role = k; refreshFiles(); } });
    document.querySelectorAll("[data-fnote]").forEach(inp => inp.oninput = () => { const x = f.files[+inp.dataset.fnote]; if (x) { x.note = inp.value; saveDraft(); } });
    document.querySelectorAll("[data-frm]").forEach(b => b.onclick = async () => { const i = +b.dataset.frm, x = f.files[i]; if (!x) return;
      f.files.splice(i, 1); refreshFiles();
      if (x.id && S.assets) { try { await S.assets.delete(x.id); } catch {} } });
  }

          <div class="col" style="gap:4px"><label class="f" for="links">Nguồn nên dùng</label>
            <textarea id="links" rows="2" placeholder="Link hoặc tên sách, bài báo. Đoàn phim kiểm chứng theo đây trước">${esc(f.links)}</textarea></div>
        </div></details>
      <div class="col"><span style="font-size:13px;font-weight:700">Nền tảng · khung hình</span>
        <div class="chips">${PLATFORMS.map(([id, n, ar]) => `<button type="button" class="chip" data-plat="${id}" aria-pressed="${f.platform === id}">${n} <span class="small" style="color:inherit;opacity:.75">${ar === "16:9" ? "ngang 16:9" : "dọc 9:16"}</span></button>`).join("")}</div>
        ${platOf(f.platform)[2] === "16:9" ? `<span class="small">Khung ngang 16:9, dài tối đa 5 phút. Phim dài hơn thì chi phí cao hơn, đoàn phim sẽ dự toán trước.</span>` : ""}</div>
      <div class="col"><div class="row between"><span style="font-size:13px;font-weight:700">Phong cách</span></div>
        <div class="styles">${styles().map(([id, n, c, th, eng]) => `<button type="button" class="sty" data-style="${esc(id)}" aria-pressed="${f.style === id}">${th ? `<img class="prev" src="${blob(th)}" alt="" loading="lazy" style="background:${esc(c)}">` : `<i style="background:${esc(c)}"></i>`}<span>${esc(n)}${eng === "3d" ? ' <span class="pill p-navy">3D</span>' : eng === "omni" ? ' <span class="pill p-wait">Động</span>' : ""}</span></button>`).join("")}<a class="sty" href="#learn" style="text-decoration:none"><i style="aspect-ratio:9/12;height:auto;background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--card) 6px 12px)"></i>+ Học phong cách mới</a></div>
        ${styleNote(f.style) ? `<span class="small">${esc(styleNote(f.style))}</span>` : ""}</div>
      <div class="card col">
        <div class="row between"><label for="len" style="font-size:14px">Độ dài</label><b id="lenv" style="font-variant-numeric:tabular-nums">${fmtLen(Math.min(f.length, maxLen(f)))}</b></div>
        <input id="len" type="range" min="15" max="${maxLen(f)}" step="${maxLen(f) > 90 ? 15 : 5}" value="${Math.min(f.length, maxLen(f))}" style="width:100%;accent-color:var(--red)">
        <div class="row between"><label for="narr" style="font-size:14px">Có lời đọc</label><input id="narr" type="checkbox" ${f.narration ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
        ${f.narration ? `<div class="col" style="gap:6px"><div class="row between"><span style="font-size:14px">Giọng đọc</span><span class="pill p-mute">${esc(curVoice())} · ${esc(String(S.voicesDoc?.tempo ?? 1.2).replace(".", ","))}x</span></div>
          ${voiceList().length ? `<div class="voices" role="radiogroup" aria-label="Chọn giọng đọc">${voiceList().map(v => `<div class="vo" role="radio" tabindex="0" aria-checked="${curVoice() === v.id}" data-voice="${esc(v.id)}">
            <button type="button" class="play" data-play="${esc(v.id)}" aria-pressed="${S.playing === v.id}" aria-label="Nghe thử giọng ${esc(v.name)}">${S.playing === v.id ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>'}</button>
            <span class="grow"><b style="font-weight:600">${esc(v.name)}</b>${v.id === (S.voicesDoc?.default || "Bodi") ? ' <span class="pill p-mute">mặc định</span>' : ""}<br><span class="small">${esc(v.desc || "")}</span></span></div>`).join("")}</div>
          <span class="small">Bấm ▶ để nghe thử câu mẫu, bấm vào dòng để chọn giọng.</span>` : `<span class="small">Đang tải danh sách giọng…</span>`}</div>` : `<span class="small">Không lời: chỉ nhạc và tiếng động.</span>`}

      <button class="btn primary big" type="submit" ${S.db ? "" : "disabled"}>Giao cho đoàn phim</button>
      ${S.db ? "" : `<p class="small">Không kết nối được cơ sở dữ liệu của app, nên chưa gửi được yêu cầu.</p>`}
    </form>`;
  };

      <div class="row" style="align-items:flex-start">

  // ===== Xưởng AI: Họa Sĩ (ChatGPT tạo ảnh) → Quay Phim (Gemini tạo video) → Dựng Phim (đoàn phim Claude ghép) =====

  const MOVES = ["Máy quay tiến chậm vào nhân vật", "Nhân vật bước đi", "Gió thổi nhẹ, tóc và lá bay", "Máy quay xoay quanh nhân vật", "Nhân vật quay đầu nhìn máy", "Ánh sáng chuyển từ ngày sang tối"];

      const loc = S.pipes.find(x => x.id === id); if (loc) Object.assign(loc, data); // giữ bản trong máy mới nhất trong lúc chờ db báo về
      try { await S.db.doc("pipelines/" + id).update({ ...data, updatedAt: nowISO() }); }

      <div class="col" style="gap:6px"><span class="f" style="font-size:13px;font-weight:700">Ảnh gốc <span class="small" style="font-weight:400">không bắt buộc</span></span>
        ${p.src ? `<div class="att"><img class="pv" src="${blob(p.src.id)}" alt=""><div class="grow"><span class="nm">${esc(p.src.name || "Ảnh gốc")}</span><span class="small">Nhớ đính kèm ảnh này khi gửi cho Họa Sĩ.</span></div><button type="button" class="xbtn" id="psrcx" aria-label="Bỏ ảnh gốc">×</button></div>`

  V.xuong = () => {

        <input id="ptitle" type="text" value="${esc(p.title || "")}" aria-label="Tên dự án" style="flex:1;min-width:0;font:400 24px var(--display);border-width:1.5px;padding:6px 10px"></div>
      <nav class="flow" aria-label="Các khâu">${PSTEPS.map(([k, n, d], i) => `<button type="button" data-pstep="${k}" class="${stepDone(p, k) ? "done" : ""}" ${stage === k ? 'aria-current="step"' : ""}><b>${i + 1}. ${n}</b><span class="small">${d}</span></button>`).join("")}</nav>

  };
  async function uploadTo(p, field, files, kind) {
    const list = [...files]; let added = 0;
    for (const file of list) {
      if (file.size > MAX_MB * 1048576) { toast(`"${file.name}" lớn hơn ${MAX_MB}MB, cắt ngắn rồi thử lại.`); continue; }
      toast(`Đang tải "${file.name}"…`);
      try { const res = await S.assets.upload(file); const cur = curPipe() || p;
        const item = kind === "src" ? { id: res.id, name: file.name } : field === "images" ? { id: res.id, name: file.name, pick: true } : { id: res.id, name: file.name };
        if (kind === "src") await savePipe(p.id, { src: item }, true);
        else await savePipe(p.id, { [field]: [...(cur[field] || []), item] }, true);
        added++; render();
      } catch (e) { toast(`Chưa tải được "${file.name}": ` + (e?.code === "unsupported_type" ? "loại tệp không hỗ trợ." : e?.code === "quota_exceeded" ? "kho tệp của app đã đầy." : "thử lại sau.")); }
    }
    if (added) toast(kind === "src" ? "Đã nhận ảnh gốc" : `Đã nhận ${added} ${field === "images" ? "ảnh" : "clip"}`);
  }
  function bindXuong() {

          edit: { narration: true, captions: true, music: true, script: "", note: "" }, stage: "hoa-si", status: "dang-lam", createdAt: nowISO(), updatedAt: nowISO() };
        const ref = await S.db.collection("pipelines").add(data);

    field("#pmotion", "motion", { after: refreshVid });
    field("#pvid", "", { wrap: v => ({ vidPrompt: v, vidEdited: true }) });
    const editField = (sel, key, isBox) => { const el = $(sel); if (el) el.addEventListener(isBox ? "change" : "input", () => { savePipe(id, { edit: { ...(curPipe().edit || {}), [key]: isBox ? el.checked : el.value } }, isBox); if (isBox && key === "narration") render(); }); };
    editField("#pscript", "script"); editField("#pnote", "note"); editField("#pnarr", "narration", true); editField("#pcap", "captions", true); editField("#pmusic", "music", true);
    const ir = $("#pimgreset"); if (ir) ir.onclick = () => { savePipe(id, { imgEdited: false, imgPrompt: "" }, true); render(); };
    const vr = $("#pvidreset"); if (vr) vr.onclick = () => { savePipe(id, { vidEdited: false, vidPrompt: "" }, true); render(); };

    document.querySelectorAll("[data-pmove]").forEach(b => b.onclick = () => { const q = curPipe(), m = b.dataset.pmove;
      const v = (q.motion || "").trim() ? q.motion.trim().replace(/[.,;]$/, "") + ", " + m.toLowerCase() : m; savePipe(id, { motion: v }); $("#pmotion").value = v; refreshVid(); });

    document.querySelectorAll("[data-popenapp]").forEach(a => a.addEventListener("click", () => {

    const sx = $("#psrcx"); if (sx) sx.onclick = async () => { const old = p.src; await savePipe(id, { src: null }, true); render(); if (old?.id && S.assets) try { await S.assets.delete(old.id); } catch {} };
    document.querySelectorAll("[data-ppick]").forEach(b => b.onclick = () => { const imgs = [...(curPipe().images || [])], i = +b.dataset.ppick; imgs[i] = { ...imgs[i], pick: !imgs[i].pick }; savePipe(id, { images: imgs }, true); render(); });
    document.querySelectorAll("[data-prm]").forEach(b => b.onclick = async () => { const [k, i] = b.dataset.prm.split("|"), arr = [...(curPipe()[k] || [])], [gone] = arr.splice(+i, 1);
      await savePipe(id, { [k]: arr }, true); render(); if (gone?.id && S.assets) try { await S.assets.delete(gone.id); } catch {} });
    document.querySelectorAll("[data-pmv]").forEach(b => b.onclick = () => { const [i, d] = b.dataset.pmv.split("|").map(Number), arr = [...(curPipe().clips || [])], j = i + d;
      if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; savePipe(id, { clips: arr }, true); render(); });
    document.querySelectorAll("[data-psave]").forEach(b => b.onclick = async () => { if (!S.dl) return; b.disabled = true;
      try { const res = await fetch(blob(b.dataset.psave)), data = await res.blob(); await S.dl.save({ filename: `qbk-anh-${b.dataset.psave.slice(0, 6)}.${data.type.includes("png") ? "png" : "jpg"}`, data }); toast("Đã lưu ảnh"); }
      catch (e) { toast(e?.code === "declined" ? "Đã hủy" : "Chưa lưu được ảnh"); } b.disabled = false; });
    document.querySelectorAll("[data-psend]").forEach(b => b.onclick = async () => { const q = curPipe(); if (!q.clips?.length) { toast("Cần ít nhất một clip"); return; } b.disabled = true;
      try { await savePipe(id, { status: "cho-dung", result: "", sentAt: nowISO() }, true);
        const ok = await fireCrew(`Xưởng AI: dựng video từ dự án pipelines/${id} (${q.clips.length} clip)`); render();
        toast(ok ? "Đã gửi. Đoàn phim bắt đầu dựng." : "Đã lưu. Nhắn \"chạy đi\" cho Claude để đoàn phim dựng.");
      } catch { b.disabled = false; toast("Chưa gửi được, thử lại sau."); } });
    $("#pdel").onclick = async () => { if (S.pipeDelArm !== id) { S.pipeDelArm = id; render(); setTimeout(() => { if (S.pipeDelArm === id) { S.pipeDelArm = null; if (route() === "xuong") render(); } }, 5000); return; }
      S.pipeDelArm = null; const q = curPipe();
      try { await S.db.doc("pipelines/" + id).delete(); S.pipeSel = null; render();
        if (S.assets) for (const a of [q.src, ...(q.images || []), ...(q.clips || [])]) if (a?.id) try { await S.assets.delete(a.id); } catch {}
        toast("Đã xóa dự án"); } catch { toast("Chưa xóa được, thử lại sau."); } };
  }

  function render() {
    if (audio && route() !== "new") { audio.pause(); audio = null; S.playing = null; }
    const r = route(); renderTabs(r);
    const fresh = render.last !== r; render.last = r;
    const keepScroll = fresh ? 0 : window.scrollY;
    const ae = document.activeElement, keep = !fresh && ae && $("#view").contains(ae) ? (ae.id ? "#" + ae.id : ae.dataset.ans ? `[data-ans="${ae.dataset.ans}"]` : ae.dataset.fnote ? `[data-fnote="${ae.dataset.fnote}"]` : null) : null;
    const sel = keep && "selectionStart" in ae ? [ae.selectionStart, ae.selectionEnd] : null;
    $("#view").innerHTML = V[r]();
    if (keep) setTimeout(() => { const el = $(keep); if (el && document.activeElement !== el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(...sel); } catch {} } });
    window.scrollTo(0, keepScroll);
    bind(r);
  }

  const voiceList = () => S.voicesDoc?.list || [];
  const curVoice = () => S.form.voice || S.voicesDoc?.default || "Bodi";
  let audio = null;
  function playVoice(id) {
    const v = voiceList().find(x => x.id === id); if (!v) return;
    if (audio) { audio.pause(); audio = null; }
    if (S.playing === id) { S.playing = null; render(); return; }
    audio = new Audio(blob(v.sample)); S.playing = id; render();
    audio.onended = () => { S.playing = null; render(); };
    audio.play().catch(() => { S.playing = null; render(); toast("Không phát được mẫu giọng trên thiết bị này"); });
  }

  // Xem lại video đã duyệt, đã đăng hoặc tạm dừng: mở trình phát trong khung nổi
  function watchVideo(v) {
    const sh = $("#sheet");

      <span class="small">${esc(styleName(v.style))}${v.duration ? " · " + esc(v.duration) + " giây" : ""}${v.round ? " · vòng " + esc(v.round) : ""} · ${esc((STATUS[v.status] || [""])[0])}</span></div>`;
    sh.hidden = false;
    const close = () => { const vd = sh.querySelector("video"); if (vd) vd.pause(); sh.hidden = true; sh.innerHTML = ""; };

  function askDelete(v) {

      <div class="tiles two"><button class="btn" id="dcancel">Hủy</button><button class="btn danger" id="dok">Xóa</button></div></div>`;
    sh.hidden = false; $("#dcancel").focus();

      } catch (e) { close(); toast("Chưa xóa được: " + (e?.code === "permission_denied" || e?.code === "not_granted" ? "bạn không có quyền xóa." : "thử lại sau.")); }

      $("#len").oninput = e => { f.length = +e.target.value; $("#lenv").textContent = fmtLen(f.length); $("#etav").textContent = "khoảng " + dur(etaTotal(f.style, f.length)); };
      document.querySelectorAll("[data-plat]").forEach(b => b.onclick = () => { f.platform = b.dataset.plat; f.length = Math.min(f.length, maxLen(f)); render(); });
      $("#gate").onchange = e => f.gate = e.target.checked;
      $("#narr").onchange = e => { f.narration = e.target.checked; render(); };
      const ga = $("#gateA"); if (ga) ga.onchange = e => f.gateA = e.target.checked;
      document.querySelectorAll("[data-play]").forEach(b => b.onclick = e => { e.stopPropagation(); playVoice(b.dataset.play); });
      document.querySelectorAll("[data-voice]").forEach(r => { const pick = () => { f.voice = r.dataset.voice; render(); }; r.onclick = pick; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } }; });
      $("#newf").onsubmit = async e => {
        e.preventDefault(); if (!S.db) return;
        if (!f.brief.trim() && !f.files.length) { toast("Viết yêu cầu hoặc thêm ít nhất một tệp"); $("#brief").focus(); return; }
        if (f.files.some(x => x.status === "up")) { toast("Đợi tệp tải xong rồi gửi nhé"); return; }
        const first = (f.brief.trim().split(/\n/)[0] || f.files[0]?.name || "Video mới").replace(/\s+/g, " ");
        const topic = first.length > 80 ? first.slice(0, 77) + "…" : first;
        const attachments = f.files.filter(x => x.status === "ok").map(x => ({ id: x.id, name: x.name, type: x.type, kind: x.kind, size: x.size, role: x.role, note: (x.note || "").trim() }));
        try { await S.db.collection("requests").add({ v: 2, topic, brief: f.brief.trim(), must: f.must.trim(), avoid: f.avoid.trim(), links: f.links.trim(), attachments, clarify: !!f.clarify, style: f.style, length: Math.min(f.length, maxLen(f)), platform: f.platform, aspect: platOf(f.platform)[2], gateScript: f.gate, gateAnimatic: isAnime(f.style) ? !!f.gateA : false, narration: !!f.narration, voice: f.narration ? curVoice() : "", status: "moi", createdAt: nowISO() });
          S.form = { ...newForm(), voice: f.voice }; saveDraft();
          go("home"); const ok = await fireCrew("Yêu cầu mới từ app: " + topic + (attachments.length ? ` (${attachments.length} tệp đính kèm)` : ""));
          toast(ok ? "Đã giao và gọi đoàn phim. Họ bắt đầu làm ngay." : "Đã lưu yêu cầu. Chưa gọi được đoàn phim tự động, nhắn \"chạy đi\" cho Claude.");
        } catch (err) { toast("Chưa gửi được: " + (err?.code === "quota_exceeded" ? "cơ sở dữ liệu đã đầy." : "thử lại sau ít phút.")); }
      };
    }
    if (r === "xuong") bindXuong();
    if (r === "home") {
      document.querySelectorAll("[data-ans]").forEach(inp => inp.oninput = () => { const [id, i] = inp.dataset.ans.split("|"); (S.answers[id] ||= {})[i] = inp.value; });
      document.querySelectorAll("[data-ansopt]").forEach(b => b.onclick = () => { const [id, i] = b.dataset.ansopt.split("|"); const a = (S.answers[id] ||= {}); a[i] = a[i] === b.dataset.val ? "" : b.dataset.val; render(); });
      document.querySelectorAll("[data-askf]").forEach(fm => fm.onsubmit = async e => { e.preventDefault(); const id = fm.dataset.askf, q = S.requests.find(x => x.id === id); if (!q || !S.db) return;
        const a = S.answers[id] || {}, answers = (q.questions || []).map((x, i) => ({ q: x.q, a: (a[i] || "").trim() }));
        if (!answers.some(x => x.a) && !(a.extra || "").trim()) { toast("Trả lời ít nhất một câu, hoặc dặn \"các bạn tự chọn\""); return; }
        const btn = fm.querySelector("[type=submit]"); btn.disabled = true;
        try { await S.db.doc("requests/" + id).update({ answers, answerNote: (a.extra || "").trim(), status: "tra-loi", answeredAt: nowISO() }); delete S.answers[id];
          const ok = await fireCrew("Trả lời câu hỏi cho yêu cầu: " + q.topic); toast(ok ? "Đã gửi. Đoàn phim làm tiếp ngay." : "Đã lưu. Nhắn \"chạy đi\" cho Claude để đoàn phim làm tiếp.");
        } catch { btn.disabled = false; toast("Chưa gửi được, thử lại sau."); } });
    }
    if (r === "learn") {
      $("#learnf").onsubmit = async e => { e.preventDefault(); const url = $("#lurl").value.trim(), name = $("#lname").value.trim(), note = $("#lnote").value.trim();
        if (!url && !note) { toast("Dán link video mẫu hoặc mô tả phong cách"); return; }
        try { await S.db.collection("styleRequests").add({ url, name, note, status: "moi", createdAt: nowISO() }); S.learnUrl = "";
          const ok = await fireCrew("Yêu cầu học phong cách mới: " + (name || url)); toast(ok ? "Đã giao. Đoàn phim bắt đầu học mẫu." : "Đã lưu. Nhắn \"chạy đi\" cho Claude để đoàn phim học."); render();
        } catch { toast("Chưa gửi được, thử lại sau."); } };
    }
    if (r === "review") {
      $("#fbf").onsubmit = e => { e.preventDefault(); const inp = $("#fbt"), txt = inp.value.trim(); if (!txt) return;
        const vid = $("#vid"); S.draftFb.push({ t: vid ? vid.currentTime : 0, text: txt }); inp.value = ""; render(); $("#fbt")?.focus(); };
      document.querySelectorAll("[data-delfb]").forEach(b => b.onclick = () => { S.draftFb.splice(+b.dataset.delfb, 1); render(); });
      const v = S.videos.find(x => x.id === S.sel);
      $("#sendfb").onclick = async () => { if (!v || !S.draftFb.length) return;
        try { const round = v.round || 1;
          await S.db.collection("feedback").add({ video: v.id, round, items: S.draftFb.map(x => ({ t: Math.round(x.t * 10) / 10, at: mmss(x.t), text: x.text })), status: "moi", createdAt: nowISO() });
          await S.db.doc("videos/" + v.id).update({ status: "dang-sua", stage: "Phân cảnh", stageNote: `Chờ đoàn phim sửa theo ${S.draftFb.length} góp ý vòng ${round}`, updatedAt: nowISO() });
          S.draftFb = []; go("home"); const ok = await fireCrew("Góp ý mới cho video " + v.id);
          toast(ok ? "Đã gửi góp ý và gọi đoàn phim sửa ngay." : "Đã lưu góp ý. Nhắn \"chạy đi\" cho Claude để đoàn phim sửa.");
        } catch { toast("Chưa gửi được góp ý, thử lại sau."); } };
      $("#approve").onclick = async () => { if (!v) return;
        try { await S.db.doc("videos/" + v.id).update({ status: "da-duyet", approvedAt: nowISO(), updatedAt: nowISO() }); toast("Đã duyệt. Mở bộ đăng bài để đăng."); go("post"); if (!v.publish) fireCrew("Video " + v.id + " đã duyệt, cần bộ đăng bài"); }
        catch { toast("Chưa duyệt được, thử lại sau."); } };
    }
    if (r === "post") {
      document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { const el = $("#" + b.dataset.copy); const txt = el.textContent;
        try { await navigator.clipboard.writeText(txt); toast("Đã sao chép"); } catch { const rg = document.createRange(); rg.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Đã chọn chữ, bấm Sao chép của điện thoại"); } });
      const v = S.videos.find(x => x.id === S.sel);
      document.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
        if (!S.dl) { toast("Thiết bị này không cho tải file từ app."); return; }
        const isVid = b.dataset.save === "video", id = isVid ? v.video : v.thumb;
        b.disabled = true; b.textContent = "Đang chuẩn bị…";
        try { const res = await fetch(blob(id)); const data = await res.blob();
          await S.dl.save({ filename: `${v.id}-${isVid ? "video.mp4" : "anh-bia." + (data.type.includes("png") ? "png" : "jpg")}`, data }); toast("Đã lưu file");
        } catch (e) { toast(e?.code === "declined" ? "Đã hủy tải" : "Chưa tải được file"); }
        b.disabled = false; b.textContent = isVid ? "Tải video" : "Tải ảnh bìa"; });
      const mp = $("#markposted"); if (mp) mp.onclick = async () => { try { await S.db.doc("videos/" + v.id).update({ status: "da-dang", postedAt: nowISO(), updatedAt: nowISO() }); toast("Đã đánh dấu đã đăng"); go("home"); } catch { toast("Chưa lưu được, thử lại sau."); } };
    }

  }

  // Gọi lại đoàn phim khi video đứng quá lâu (nút nằm trong vùng dự kiến, vùng này tự làm mới mỗi 30 giây)
  document.addEventListener("click", async e => { const b = e.target.closest("[data-revive]"); if (!b || !S.db) return;
    const v = S.videos.find(x => x.id === b.dataset.revive); if (!v) return; b.disabled = true;
    try { await S.db.doc("videos/" + v.id).update({ reviveAt: nowISO(), error: null }); } catch {}
    const ok = await fireCrew(`Video ${v.id} đứng ở bước ${v.stage || "?"} từ ${v.updatedAt || "?"} (không thấy cập nhật). Kiểm tra và làm tiếp từ bước này.`);
    toast(ok ? "Đã gọi đoàn phim làm tiếp." : "Chưa gọi được, nhắn \"chạy đi\" cho Claude."); if (!ok) b.disabled = false; });
  function refreshLive() {
    document.querySelectorAll("[data-eta]").forEach(el => { const v = S.videos.find(x => x.id === el.dataset.eta); if (v) el.innerHTML = etaHtml(v); });
    const rb = $("[data-run]"); if (rb) rb.innerHTML = runHtml();
  }
  setInterval(refreshLive, 30000);
  const RUN_OFF = ["not_in_manifest", "blocked_by_policy", "not_granted", "capability_disabled", "capability_removed", "server_not_connected", "approval_required", "needs_reauth"];
  async function pollRun() {
    if (!S.mcp || S.runOff || document.hidden) return;
    try {
      const t = (await S.mcp.callTool("Claude Code Remote", "get_trigger", { trigger_id: TRIGGER }, { cache: false }))?.payload;
      const lr = (t?.trigger || t)?.last_run;
      if (lr?.session_id && !S.noSession) {
        try { const p = (await S.mcp.callTool("Claude Code Remote", "get_session", { session_id: lr.session_id }, { cache: false }))?.payload;
          S.run = { session: p?.ccr || p?.session || p, firedAt: lr.fired_at };
        } catch (e) { if (RUN_OFF.includes(e?.code) || e?.code === "tool_error") S.noSession = true; S.run = null; }
      }
      S.runErr = null;
    } catch (e) { S.runErr = e?.code || "lỗi"; if (RUN_OFF.includes(e?.code)) S.runOff = true; }
    refreshLive();
  }
  setInterval(pollRun, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pollRun(); });

  render();
  (async () => {
    const db = await window.claude?.use?.("db").catch(() => null);
    S.dl = await window.claude?.use?.("downloads").catch(() => null);
    S.assets = await window.claude?.use?.("assets").catch(() => null);
    S.mcp = await window.claude?.use?.("mcp").catch(() => null);
    pollRun();
    if (!db) { S.ready = true; render(); return; }
    S.db = db;
    const live = (ref, fn) => ref.onSnapshot(fn, () => { S.ready = true; render(); });
    live(db.collection("videos").orderBy("updatedAt", "desc"), snap => { S.videos = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready = true; render(); });
    live(db.collection("requests").orderBy("createdAt", "desc").limit(50), snap => { S.requests = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
    live(db.doc("app/crew"), d => { S.crew = d.exists ? d.data() : null; render(); });
    live(db.doc("app/voices"), d => { S.voicesDoc = d.exists ? d.data() : null; render(); });
    live(db.doc("app/styles"), d => { S.stylesDoc = d.exists ? d.data() : null; render(); });
    live(db.collection("styleRequests").orderBy("createdAt", "desc").limit(20), snap => { S.styleReqs = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
    live(db.doc("app/run"), d => { S.runDoc = d.exists ? d.data() : null; refreshLive(); });
    live(db.collection("pipelines").orderBy("updatedAt", "desc").limit(30), snap => { S.pipes = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (route() === "xuong") render(); });
    live(db.doc("app/stats"), d => { S.stats = d.exists ? d.data() : null; render(); });
  })();
})();
</script>
